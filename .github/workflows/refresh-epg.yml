name: Refresh demo EPG

# Regenerates the date-relative demo EPG every day so the guide stays
# populated (yesterday -> +8 days) whenever an App Store reviewer tests,
# no matter how long after submission that happens.

on:
  schedule:
    - cron: "17 6 * * *"   # daily ~06:17 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-epg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Regenerate EPG
        run: python gen_epg.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add givostream-demo-epg.xml
          if git diff --staged --quiet; then
            echo "EPG unchanged — nothing to commit."
          else
            git commit -m "Refresh demo EPG ($(date -u +%F))"
            git push
          fi
